name: Select Carr Lead Intake 3H

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: select-carr-lead-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Import Telegram leads
        env:
          SELECT_CARR_INTAKE_BOT_TOKEN: ${{ secrets.SELECT_CARR_INTAKE_BOT_TOKEN }}
          SELECT_CARR_DATA_SECRET: ${{ secrets.SELECT_CARR_DATA_SECRET }}
          SELECT_CARR_ENCRYPTED_DB: private_data/select_carr_banks.sqlite3.enc
          SELECT_CARR_TELEGRAM_OFFSET_FILE: private_data/telegram_offset.txt
        run: python select_carr_telegram_intake.py

      - name: Commit encrypted bank state
        run: |
          if git diff --quiet -- private_data/select_carr_banks.sqlite3.enc private_data/telegram_offset.txt; then
            echo "No bank changes."
            exit 0
          fi
          git config user.name "select-carr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add private_data/select_carr_banks.sqlite3.enc private_data/telegram_offset.txt
          git commit -m "Update encrypted Select Carr lead bank"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
