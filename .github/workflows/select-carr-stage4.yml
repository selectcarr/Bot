name: Select Carr Stage 4

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Stage 4 action"
        required: true
        default: "check_buffer"
        type: choice
        options:
          - check_buffer

permissions:
  contents: read

concurrency:
  group: select-carr-stage4
  cancel-in-progress: false

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Stage 4
        run: |
          python -m py_compile select_carr_stage4.py

      - name: Check Buffer API and both Instagram channels
        run: |
          python select_carr_stage4.py check_buffer
