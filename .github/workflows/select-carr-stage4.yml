name: Select Carr Stage 4

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Stage 4 action"
        required: true
        default: "check_buffer"
        type: choice
        options:
          - check_buffer
          - validate_templates
          - build
          - publish_opportunity
          - publish_story_queue
          - publish_market
          - publish_cars

  # GitHub Actions cron is UTC.
  # Tehran is UTC+03:30 year-round.
  # Running at 07/22/37/52 UTC minutes produces the same four
  # off-peak quarter-hour positions in Tehran, rotated by +30 minutes.
  # Python decides what is actually due on every scheduled wake-up.
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: select-carr-stage4
  cancel-in-progress: false

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_API_URL: https://api.buffer.com

      ACCURATE_STATE_ENCRYPTION_KEY: >-
        ${{ secrets.ACCURATE_STATE_ENCRYPTION_KEY }}

      SELECT_CARR_DATA_SECRET: >-
        ${{ secrets.SELECT_CARR_DATA_SECRET }}

      SELECT_CARR_ENCRYPTED_DB: >-
        private_data/select_carr_banks.sqlite3.enc

      SELECT_CARR_MARKET_DB: >-
        select_carr_market_runtime/select_carr_market.sqlite3

      SELECT_CARR_SOURCE_CHANNEL_URL: >-
        https://t.me/s/DO_L4

      STAGE4_TEMPLATE_DIR: >-
        assets/stage4_templates

      STAGE4_OUTPUT_DIR: >-
        stage4_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve Stage 4 action
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            action="scheduled"
            mode="all"
          else
            action="${MANUAL_ACTION:-check_buffer}"

            case "${action}" in
              check_buffer|validate_templates|build|publish_opportunity|publish_story_queue|publish_market|publish_cars)
                ;;
              *)
                echo "Unsupported Stage 4 action: ${action}"
                exit 1
                ;;
            esac

            case "${action}" in
              publish_opportunity)
                mode="opportunity"
                ;;
              publish_story_queue)
                mode="story_queue"
                ;;
              publish_market)
                mode="market"
                ;;
              publish_cars)
                mode="cars"
                ;;
              build)
                mode="all"
                ;;
              *)
                mode="all"
                ;;
            esac
          fi

          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

          echo "Resolved action=${action} mode=${mode}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            fontconfig \
            fonts-noto-core \
            fonts-dejavu-core

          python -m pip install \
            --disable-pip-version-check \
            cryptography \
            pillow \
            beautifulsoup4

      - name: Resolve Persian and Latin fonts
        shell: bash
        run: |
          set -euo pipefail

          REGULAR_FONT="$(
            fc-match \
              -f '%{file}\n' \
              'Noto Sans Arabic:style=Regular' \
            | head -n 1
          )"

          BOLD_FONT="$(
            fc-match \
              -f '%{file}\n' \
              'Noto Sans Arabic:style=Bold' \
            | head -n 1
          )"

          LATIN_REGULAR_FONT="$(
            fc-match \
              -f '%{file}\n' \
              'DejaVu Sans:style=Book' \
            | head -n 1
          )"

          LATIN_BOLD_FONT="$(
            fc-match \
              -f '%{file}\n' \
              'DejaVu Sans:style=Bold' \
            | head -n 1
          )"

          if [[ -z "${REGULAR_FONT}" ]]; then
            echo "Regular Persian font path is empty."
            exit 1
          fi

          if [[ -z "${BOLD_FONT}" ]]; then
            echo "Bold Persian font path is empty."
            exit 1
          fi

          if [[ ! -f "${REGULAR_FONT}" ]]; then
            echo "Persian regular font was not found:"
            echo "${REGULAR_FONT}"
            exit 1
          fi

          if [[ ! -f "${BOLD_FONT}" ]]; then
            echo "Persian bold font was not found:"
            echo "${BOLD_FONT}"
            exit 1
          fi

          if [[ -z "${LATIN_REGULAR_FONT}" || ! -f "${LATIN_REGULAR_FONT}" ]]; then
            echo "Latin regular font was not found."
            exit 1
          fi

          if [[ -z "${LATIN_BOLD_FONT}" || ! -f "${LATIN_BOLD_FONT}" ]]; then
            echo "Latin bold font was not found."
            exit 1
          fi

          echo "STAGE4_FONT_REGULAR=${REGULAR_FONT}" \
            >> "${GITHUB_ENV}"

          echo "STAGE4_FONT_BOLD=${BOLD_FONT}" \
            >> "${GITHUB_ENV}"

          echo "STAGE4_FONT_LATIN_REGULAR=${LATIN_REGULAR_FONT}" \
            >> "${GITHUB_ENV}"

          echo "STAGE4_FONT_LATIN_BOLD=${LATIN_BOLD_FONT}" \
            >> "${GITHUB_ENV}"

          echo "Regular Persian font:"
          echo "${REGULAR_FONT}"

          echo "Bold Persian font:"
          echo "${BOLD_FONT}"

          echo "Regular Latin font:"
          echo "${LATIN_REGULAR_FONT}"

          echo "Bold Latin font:"
          echo "${LATIN_BOLD_FONT}"

      - name: Compile Stage 4
        run: |
          set -euo pipefail

          python -m py_compile \
            select_carr_stage4.py

      - name: Validate locked templates and Persian text engine
        if: >-
          steps.resolve.outputs.action != 'check_buffer'
        run: |
          set -euo pipefail

          python \
            select_carr_stage4.py \
            validate_templates

      - name: Restore Stage 4 publish memory
        if: >-
          steps.resolve.outputs.action == 'scheduled' ||
          startsWith(
            steps.resolve.outputs.action,
            'publish_'
          )
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            stage4_runtime

          git fetch \
            origin \
            select-carr-stage4-media:refs/remotes/origin/select-carr-stage4-media \
            || true

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/select-carr-stage4-media
          then
            git show \
              origin/select-carr-stage4-media:stage4_publish_state.json \
              > stage4_runtime/publish_state.json \
              2>/dev/null \
              || true
          fi

      - name: Determine scheduled Stage 4 work
        id: plan
        if: >-
          steps.resolve.outputs.action == 'scheduled'
        shell: bash
        run: |
          set -euo pipefail

          PLAN="$(
            python \
              select_carr_stage4.py \
              schedule_plan
          )"

          echo "Scheduled plan:"
          echo "${PLAN}"

          echo "plan=${PLAN}" >> "${GITHUB_OUTPUT}"

      - name: Restore Select Carr market state
        if: >-
          steps.resolve.outputs.action == 'build' ||
          steps.resolve.outputs.action == 'publish_opportunity' ||
          steps.resolve.outputs.action == 'publish_story_queue' ||
          (
            steps.resolve.outputs.action == 'scheduled' &&
            contains(
              steps.plan.outputs.plan,
              'story_queue'
            )
          )
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACCURATE_STATE_ENCRYPTION_KEY}" ]]; then
            echo "ACCURATE_STATE_ENCRYPTION_KEY is missing."
            exit 1
          fi

          rm -rf \
            select_carr_market_runtime

          mkdir -p \
            select_carr_market_runtime

          git fetch \
            origin \
            select-carr-market-state:refs/remotes/origin/select-carr-market-state

          git show \
            origin/select-carr-market-state:select-carr-market/runtime.tar.gz.enc \
            > /tmp/select-carr-market-runtime.tar.gz.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -in /tmp/select-carr-market-runtime.tar.gz.enc \
            -out /tmp/select-carr-market-runtime.tar.gz \
            -pass env:ACCURATE_STATE_ENCRYPTION_KEY

          tar \
            -xzf \
            /tmp/select-carr-market-runtime.tar.gz \
            -C select_carr_market_runtime

          test -f \
            select_carr_market_runtime/select_carr_market.sqlite3

      - name: Run Stage 4 Buffer check
        if: >-
          steps.resolve.outputs.action == 'check_buffer'
        run: |
          set -euo pipefail

          python \
            select_carr_stage4.py \
            check_buffer

      - name: Build Stage 4 media
        if: >-
          steps.resolve.outputs.action == 'build' ||
          startsWith(
            steps.resolve.outputs.action,
            'publish_'
          )
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail

          python \
            select_carr_stage4.py \
            build \
            --mode "${STAGE4_MODE}"

      - name: Prepare generated media branch
        id: media
        if: >-
          steps.resolve.outputs.action == 'scheduled' ||
          startsWith(
            steps.resolve.outputs.action,
            'publish_'
          )
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
          STAGE4_ACTION: ${{ steps.resolve.outputs.action }}
        run: |
          set -euo pipefail

          shopt -s nullglob

          git config \
            user.name \
            "select-carr-bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          rm -rf \
            /tmp/select-carr-stage4-media

          git fetch \
            origin \
            select-carr-stage4-media:refs/remotes/origin/select-carr-stage4-media \
            || true

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/select-carr-stage4-media
          then
            git worktree add \
              -B select-carr-stage4-media \
              /tmp/select-carr-stage4-media \
              origin/select-carr-stage4-media
          else
            git worktree add \
              --detach \
              /tmp/select-carr-stage4-media \
              HEAD

            cd \
              /tmp/select-carr-stage4-media

            git switch \
              --orphan \
              select-carr-stage4-media

            git rm \
              -rf . \
              || true

            cd \
              "${GITHUB_WORKSPACE}"
          fi

          if [[ "${STAGE4_ACTION}" == "scheduled" ]]; then
            echo "has_media=false" \
              >> "${GITHUB_OUTPUT}"

            exit 0
          fi

          media_files=(
            stage4_runtime/*.jpeg
          )

          if (( ${#media_files[@]} == 0 )); then
            echo "has_media=false" \
              >> "${GITHUB_OUTPUT}"
          else
            echo "has_media=true" \
              >> "${GITHUB_OUTPUT}"
          fi

          if (( ${#media_files[@]} > 0 )); then
            if [[ "${STAGE4_MODE}" == "cars" ]]; then
              rm -f \
                /tmp/select-carr-stage4-media/post_car_prices_*.jpeg
            fi

            cp \
              "${media_files[@]}" \
              /tmp/select-carr-stage4-media/
          fi

          if [[ -f stage4_runtime/manifest.json ]]; then
            cp \
              stage4_runtime/manifest.json \
              /tmp/select-carr-stage4-media/manifest.json
          fi

          if [[ -f stage4_runtime/publish_state.json ]]; then
            cp \
              stage4_runtime/publish_state.json \
              /tmp/select-carr-stage4-media/stage4_publish_state.json
          fi

          cd \
            /tmp/select-carr-stage4-media

          git add .

          git commit \
            -m "Update Select Carr Stage 4 media/state" \
            || true

          git push \
            origin \
            HEAD:select-carr-stage4-media

      - name: Run scheduled Stage 4 work
        if: >-
          steps.resolve.outputs.action == 'scheduled'
        shell: bash
        env:
          SCHEDULED_PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail

          mapfile -t MODES < <(
            python - <<'PY'
          import json
          import os

          payload = json.loads(
              os.environ['SCHEDULED_PLAN']
          )

          for mode in payload.get(
              'due_modes',
              [],
          ):
              print(mode)
          PY
          )

          if (( ${#MODES[@]} == 0 )); then
            echo "Nothing is due in this scheduled run."
            exit 0
          fi

          for mode in "${MODES[@]}"; do
            echo "=================================================="
            echo "Scheduled Stage 4 mode: ${mode}"
            echo "=================================================="

            python \
              select_carr_stage4.py \
              build \
              --mode "${mode}"

            shopt -s nullglob

            media_files=(
              stage4_runtime/*.jpeg
            )

            if [[ "${mode}" == "cars" ]]; then
              rm -f \
                /tmp/select-carr-stage4-media/post_car_prices_*.jpeg
            fi

            if (( ${#media_files[@]} > 0 )); then
              cp \
                "${media_files[@]}" \
                /tmp/select-carr-stage4-media/
            fi

            if [[ -f stage4_runtime/manifest.json ]]; then
              cp \
                stage4_runtime/manifest.json \
                /tmp/select-carr-stage4-media/manifest.json
            fi

            if [[ -f stage4_runtime/publish_state.json ]]; then
              cp \
                stage4_runtime/publish_state.json \
                /tmp/select-carr-stage4-media/stage4_publish_state.json
            fi

            cd \
              /tmp/select-carr-stage4-media

            git add .

            git commit \
              -m "Prepare scheduled Select Carr Stage 4 ${mode}" \
              || true

            git push \
              origin \
              HEAD:select-carr-stage4-media

            cd \
              "${GITHUB_WORKSPACE}"

            if (( ${#media_files[@]} == 0 )); then
              echo "No media was built for ${mode}; it will retry on a later scheduled run."
              continue
            fi

            python \
              select_carr_stage4.py \
              publish \
              --mode "${mode}"

            if [[ -f stage4_runtime/publish_state.json ]]; then
              cp \
                stage4_runtime/publish_state.json \
                /tmp/select-carr-stage4-media/stage4_publish_state.json
            fi

            cd \
              /tmp/select-carr-stage4-media

            git add \
              stage4_publish_state.json \
              2>/dev/null \
              || true

            git commit \
              -m "Persist scheduled Select Carr Stage 4 ${mode} state" \
              || true

            git push \
              origin \
              HEAD:select-carr-stage4-media

            cd \
              "${GITHUB_WORKSPACE}"
          done

      - name: Publish selected Stage 4 content
        if: >-
          startsWith(
            steps.resolve.outputs.action,
            'publish_'
          ) &&
          steps.media.outputs.has_media == 'true'
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail

          python \
            select_carr_stage4.py \
            publish \
            --mode "${STAGE4_MODE}"

      - name: Persist Stage 4 publish memory
        if: >-
          always() &&
          (
            steps.resolve.outputs.action == 'scheduled' ||
            startsWith(
              steps.resolve.outputs.action,
              'publish_'
            )
          )
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f stage4_runtime/publish_state.json ]]; then
            echo "No publish-state file to persist."
            exit 0
          fi

          if [[ ! -e /tmp/select-carr-stage4-media/.git ]]; then
            echo "Media worktree unavailable; state remains in workflow artifact."
            exit 0
          fi

          cp \
            stage4_runtime/publish_state.json \
            /tmp/select-carr-stage4-media/stage4_publish_state.json

          cd \
            /tmp/select-carr-stage4-media

          git config \
            user.name \
            "select-carr-bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            stage4_publish_state.json

          git commit \
            -m "Update Select Carr Stage 4 publish state" \
            || true

          git push \
            origin \
            HEAD:select-carr-stage4-media

      - name: Upload Stage 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-carr-stage4-${{ github.run_id }}
          path: |
            stage4_runtime/
          if-no-files-found: ignore
