name: Select Carr Stage 4

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Stage 4 action"
        required: true
        default: "check_buffer"
        type: choice
        options:
          - check_buffer
          - validate_templates
          - build
          - publish_opportunity
          - publish_story_queue
          - publish_market
          - publish_cars

  # Tehran is UTC+03:30.
  # Story queue runs every 15 minutes only inside the allowed windows:
  # 11:00-15:00 and 19:00-23:00 Tehran.
  # Feed posts run at the requested weekday-specific target time and retry hourly.
  schedule:
    # Story window 11:00-15:00 Tehran (last tick 14:45)
    - cron: "30,45 7 * * *"
    - cron: "0,15,30,45 8-10 * * *"
    - cron: "0,15 11 * * *"

    # Story window 19:00-23:00 Tehran (last tick 22:45)
    - cron: "30,45 15 * * *"
    - cron: "0,15,30,45 16-18 * * *"
    - cron: "0,15 19 * * *"

    # Saturday: market 13:30; cars 21:30. Retry hourly (+1h, +2h).
    - cron: "0 10-12 * * 6"
    - cron: "0 18-20 * * 6"

    # Sunday: market 12:00; cars 14:30. Retry hourly (+1h, +2h).
    - cron: "30 8-10 * * 0"
    - cron: "0 11-13 * * 0"

    # Monday: market 14:30 (+1h,+2h); cars 22:30 (+1h only, before midnight).
    - cron: "0 11-13 * * 1"
    - cron: "0 19-20 * * 1"

    # Tuesday: market 13:30; cars 20:30. Retry hourly (+1h, +2h).
    - cron: "0 10-12 * * 2"
    - cron: "0 17-19 * * 2"

    # Wednesday: market 13:00 (+1h,+2h); cars 22:00 (+1h only, before midnight).
    - cron: "30 9-11 * * 3"
    - cron: "30 18-19 * * 3"

    # Thursday: market 12:00; cars 14:00. Final +2h retry may use previous-day source prices.
    - cron: "30 8-10 * * 4"
    - cron: "30 10-12 * * 4"

    # Friday: market 11:30; cars 14:00. Final +2h retry may use previous-day source prices.
    - cron: "0 8-10 * * 5"
    - cron: "30 10-12 * * 5"

permissions:
  contents: write

concurrency:
  group: select-carr-stage4
  cancel-in-progress: false

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_API_URL: https://api.buffer.com

      ACCURATE_STATE_ENCRYPTION_KEY: >-
        ${{ secrets.ACCURATE_STATE_ENCRYPTION_KEY }}

      SELECT_CARR_DATA_SECRET: >-
        ${{ secrets.SELECT_CARR_DATA_SECRET }}

      SELECT_CARR_ENCRYPTED_DB: >-
        private_data/select_carr_banks.sqlite3.enc

      SELECT_CARR_MARKET_DB: >-
        select_carr_market_runtime/select_carr_market.sqlite3

      SELECT_CARR_SOURCE_CHANNEL_URL: >-
        https://t.me/s/DO_L4

      STAGE4_TEMPLATE_DIR: >-
        assets/stage4_templates

      STAGE4_OUTPUT_DIR: >-
        stage4_runtime

      STAGE4_FONT_REGULAR: >-
        assets/fonts/Vazirmatn-Regular.ttf

      STAGE4_FONT_BOLD: >-
        assets/fonts/Vazirmatn-Bold.ttf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve Stage 4 action
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "30,45 7 * * *"|"0,15,30,45 8-10 * * *"|"0,15 11 * * *"|\
              "30,45 15 * * *"|"0,15,30,45 16-18 * * *"|"0,15 19 * * *")
                action="publish_story_queue"
                ;;

              "0 10-12 * * 6"|"30 8-10 * * 0"|"0 11-13 * * 1"|\
              "0 10-12 * * 2"|"30 9-11 * * 3"|"30 8-10 * * 4"|"0 8-10 * * 5")
                action="publish_market"
                ;;

              "0 18-20 * * 6"|"0 11-13 * * 0"|"0 19-20 * * 1"|\
              "0 17-19 * * 2"|"30 18-19 * * 3"|"30 10-12 * * 4"|"30 10-12 * * 5")
                action="publish_cars"
                ;;

              *)
                echo "Unknown schedule: ${EVENT_SCHEDULE}"
                exit 1
                ;;
            esac
          else
            action="${MANUAL_ACTION:-check_buffer}"
          fi

          case "${action}" in
            check_buffer|validate_templates|build|publish_opportunity|publish_story_queue|publish_market|publish_cars)
              ;;
            *)
              echo "Unsupported Stage 4 action: ${action}"
              exit 1
              ;;
          esac

          case "${action}" in
            publish_opportunity)
              mode="opportunity"
              ;;
            publish_story_queue)
              mode="story_queue"
              ;;
            publish_market)
              mode="market"
              ;;
            publish_cars)
              mode="cars"
              ;;
            build)
              mode="all"
              ;;
            *)
              mode="all"
              ;;
          esac

          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Resolved action=${action} mode=${mode}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-core \
            fonts-dejavu-core

          python -m pip install \
            --disable-pip-version-check \
            cryptography \
            pillow \
            beautifulsoup4

      - name: Compile Stage 4
        run: |
          set -euo pipefail
          python -m py_compile select_carr_stage4.py

      - name: Validate locked templates and Persian text engine
        if: >-
          steps.resolve.outputs.action != 'check_buffer'
        run: |
          set -euo pipefail
          python select_carr_stage4.py validate_templates

      - name: Restore Stage 4 publish memory
        if: >-
          startsWith(steps.resolve.outputs.action, 'publish_')
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stage4_runtime

          git fetch origin \
            select-carr-stage4-media:refs/remotes/origin/select-carr-stage4-media \
            || true

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/select-carr-stage4-media
          then
            git show \
              origin/select-carr-stage4-media:stage4_publish_state.json \
              > stage4_runtime/publish_state.json \
              2>/dev/null \
              || true
          fi

      - name: Restore Select Carr market state
        if: >-
          steps.resolve.outputs.action == 'build' ||
          steps.resolve.outputs.action == 'publish_opportunity' ||
          steps.resolve.outputs.action == 'publish_story_queue'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACCURATE_STATE_ENCRYPTION_KEY}" ]]; then
            echo "ACCURATE_STATE_ENCRYPTION_KEY is missing."
            exit 1
          fi

          rm -rf select_carr_market_runtime
          mkdir -p select_carr_market_runtime

          git fetch origin \
            select-carr-market-state:refs/remotes/origin/select-carr-market-state

          git show \
            origin/select-carr-market-state:select-carr-market/runtime.tar.gz.enc \
            > /tmp/select-carr-market-runtime.tar.gz.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -in /tmp/select-carr-market-runtime.tar.gz.enc \
            -out /tmp/select-carr-market-runtime.tar.gz \
            -pass env:ACCURATE_STATE_ENCRYPTION_KEY

          tar -xzf \
            /tmp/select-carr-market-runtime.tar.gz \
            -C select_carr_market_runtime

          test -f \
            select_carr_market_runtime/select_carr_market.sqlite3

      - name: Run Stage 4 Buffer check
        if: >-
          steps.resolve.outputs.action == 'check_buffer'
        run: |
          set -euo pipefail
          python select_carr_stage4.py check_buffer

      - name: Build Stage 4 media
        if: >-
          steps.resolve.outputs.action == 'build' ||
          startsWith(steps.resolve.outputs.action, 'publish_')
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          python select_carr_stage4.py build --mode "${STAGE4_MODE}"

      - name: Prepare generated media branch
        id: media
        if: >-
          startsWith(steps.resolve.outputs.action, 'publish_')
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          media_files=(stage4_runtime/*.jpeg)

          if (( ${#media_files[@]} == 0 )); then
            echo "has_media=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_media=true" >> "${GITHUB_OUTPUT}"
          fi

          git config user.name "select-carr-bot"
          git config user.email "actions@users.noreply.github.com"

          rm -rf /tmp/select-carr-stage4-media

          git fetch origin \
            select-carr-stage4-media:refs/remotes/origin/select-carr-stage4-media \
            || true

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/select-carr-stage4-media
          then
            git worktree add \
              -B select-carr-stage4-media \
              /tmp/select-carr-stage4-media \
              origin/select-carr-stage4-media
          else
            git worktree add \
              --detach \
              /tmp/select-carr-stage4-media \
              HEAD

            cd /tmp/select-carr-stage4-media
            git switch --orphan \
              select-carr-stage4-media

            git rm \
              -rf . \
              || true

            cd "${GITHUB_WORKSPACE}"
          fi

          if (( ${#media_files[@]} > 0 )); then
            if [[ "${STAGE4_MODE}" == "cars" ]]; then
              rm -f \
                /tmp/select-carr-stage4-media/post_car_prices_*.jpeg
            fi

            cp \
              "${media_files[@]}" \
              /tmp/select-carr-stage4-media/
          fi

          if [[ -f stage4_runtime/manifest.json ]]; then
            cp \
              stage4_runtime/manifest.json \
              /tmp/select-carr-stage4-media/manifest.json
          fi

          if [[ -f stage4_runtime/publish_state.json ]]; then
            cp \
              stage4_runtime/publish_state.json \
              /tmp/select-carr-stage4-media/stage4_publish_state.json
          fi

          cd /tmp/select-carr-stage4-media

          git add .

          git commit \
            -m "Update Select Carr Stage 4 media/state" \
            || true

          git push \
            origin \
            HEAD:select-carr-stage4-media

      - name: Publish selected Stage 4 content
        if: >-
          startsWith(steps.resolve.outputs.action, 'publish_') &&
          steps.media.outputs.has_media == 'true'
        shell: bash
        env:
          STAGE4_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          python select_carr_stage4.py \
            publish \
            --mode "${STAGE4_MODE}"

      - name: Persist Stage 4 publish memory
        if: >-
          always() &&
          startsWith(steps.resolve.outputs.action, 'publish_')
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f stage4_runtime/publish_state.json ]]; then
            echo "No publish-state file to persist."
            exit 0
          fi

          if [[ ! -e /tmp/select-carr-stage4-media/.git ]]; then
            echo "Media worktree unavailable; state remains in workflow artifact."
            exit 0
          fi

          cp \
            stage4_runtime/publish_state.json \
            /tmp/select-carr-stage4-media/stage4_publish_state.json

          cd /tmp/select-carr-stage4-media

          git config \
            user.name \
            "select-carr-bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          git add \
            stage4_publish_state.json

          git commit \
            -m "Update Select Carr Stage 4 publish state" \
            || true

          git push \
            origin \
            HEAD:select-carr-stage4-media

      - name: Upload Stage 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-carr-stage4-${{ github.run_id }}
          path: |
            stage4_runtime/
          if-no-files-found: ignore
