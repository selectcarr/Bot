name: Select Carr Stage 4

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Stage 4 action"
        required: true
        default: "check_buffer"
        type: choice
        options:
          - check_buffer
          - validate_templates
          - build
          - publish

permissions:
  contents: write

concurrency:
  group: select-carr-bank-writer
  cancel-in-progress: false

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_API_URL: https://api.buffer.com

      ACCURATE_STATE_ENCRYPTION_KEY: >-
        ${{ secrets.ACCURATE_STATE_ENCRYPTION_KEY }}

      SELECT_CARR_DATA_SECRET: >-
        ${{ secrets.SELECT_CARR_DATA_SECRET }}

      SELECT_CARR_ENCRYPTED_DB: >-
        private_data/select_carr_banks.sqlite3.enc

      SELECT_CARR_MARKET_DB: >-
        select_carr_market_runtime/select_carr_market.sqlite3

      SELECT_CARR_CONTENT_CHANNEL_URL: >-
        https://t.me/s/select_carr

      STAGE4_TEMPLATE_DIR: >-
        assets/stage4_templates

      STAGE4_OUTPUT_DIR: >-
        stage4_runtime

      STAGE4_FONT_REGULAR: >-
        assets/fonts/Vazirmatn-Regular.ttf

      STAGE4_FONT_BOLD: >-
        assets/fonts/Vazirmatn-Bold.ttf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core

          python -m pip install \
            --disable-pip-version-check \
            cryptography \
            pillow \
            arabic-reshaper \
            python-bidi

      - name: Compile Stage 4
        run: |
          set -euo pipefail

          python -m py_compile \
            select_carr_stage4.py

      - name: Validate locked templates
        if: >-
          github.event.inputs.action == 'validate_templates' ||
          github.event.inputs.action == 'build' ||
          github.event.inputs.action == 'publish'
        run: |
          set -euo pipefail

          python select_carr_stage4.py \
            validate_templates

      - name: Restore Select Carr market state
        if: >-
          github.event.inputs.action == 'build' ||
          github.event.inputs.action == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACCURATE_STATE_ENCRYPTION_KEY}" ]]; then
            echo "ACCURATE_STATE_ENCRYPTION_KEY is missing."
            exit 1
          fi

          rm -rf select_carr_market_runtime

          mkdir -p select_carr_market_runtime

          git fetch origin \
            select-carr-market-state:refs/remotes/origin/select-carr-market-state

          git show \
            origin/select-carr-market-state:select-carr-market/runtime.tar.gz.enc \
            > /tmp/select-carr-market-runtime.tar.gz.enc

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -in /tmp/select-carr-market-runtime.tar.gz.enc \
            -out /tmp/select-carr-market-runtime.tar.gz \
            -pass env:ACCURATE_STATE_ENCRYPTION_KEY

          tar -xzf \
            /tmp/select-carr-market-runtime.tar.gz \
            -C select_carr_market_runtime

          test -f \
            select_carr_market_runtime/select_carr_market.sqlite3

      - name: Run Stage 4 Buffer check
        if: >-
          github.event.inputs.action == 'check_buffer'
        run: |
          set -euo pipefail

          python select_carr_stage4.py \
            check_buffer

      - name: Build Stage 4 media
        if: >-
          github.event.inputs.action == 'build' ||
          github.event.inputs.action == 'publish'
        run: |
          set -euo pipefail

          python select_carr_stage4.py \
            build

      - name: Publish generated media branch
        if: >-
          github.event.inputs.action == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "select-carr-bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"

          rm -rf \
            /tmp/select-carr-stage4-media

          git fetch origin \
            select-carr-stage4-media:refs/remotes/origin/select-carr-stage4-media \
            || true

          if git show-ref \
            --verify \
            --quiet \
            refs/remotes/origin/select-carr-stage4-media
          then
            git worktree add \
              -B select-carr-stage4-media \
              /tmp/select-carr-stage4-media \
              origin/select-carr-stage4-media
          else
            git worktree add \
              --detach \
              /tmp/select-carr-stage4-media \
              HEAD

            cd \
              /tmp/select-carr-stage4-media

            git switch \
              --orphan \
              select-carr-stage4-media

            git rm \
              -rf . \
              || true

            cd \
              "${GITHUB_WORKSPACE}"
          fi

          find \
            /tmp/select-carr-stage4-media \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          shopt -s nullglob
          media_files=(stage4_runtime/*.jpeg)

          if (( ${#media_files[@]} == 0 )); then
            echo "No Stage 4 media files were generated."
            exit 1
          fi

          cp \
            "${media_files[@]}" \
            /tmp/select-carr-stage4-media/

          cd \
            /tmp/select-carr-stage4-media

          git add .

          git commit \
            -m "Update Select Carr Stage 4 media" \
            || true

          git push \
            origin \
            HEAD:select-carr-stage4-media

      - name: Publish to both Instagram channels
        if: >-
          github.event.inputs.action == 'publish'
        run: |
          set -euo pipefail

          python select_carr_stage4.py \
            publish

      - name: Upload Stage 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select-carr-stage4-${{ github.run_id }}
          path: |
            stage4_runtime/
          if-no-files-found: ignore
