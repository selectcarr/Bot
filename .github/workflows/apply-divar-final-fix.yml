          echo "${EXPECTED_BUNDLE_SHA256}  /tmp/divar-final-fix/payload.zip" | sha256sum --check --strict

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          expected = set(['divar_service/config/settings.py', 'divar_service/config/aliases.py', 'divar_service/normalizer.py', 'divar_service/extractor.py', 'divar_service/models.py', 'divar_service/comparison.py', 'divar_service/deal_finder.py', 'divar_service/analyzer.py', 'divar_service/filters.py', 'divar_service/page_parser.py', 'divar_service/storage/database.py', 'divar_service/storage/ads_repository.py', 'divar_service/storage/schedule_repository.py', 'divar_service/scheduler.py', 'divar_service/collector.py', 'divar_service/app.py'])
          archive_path = Path("/tmp/divar-final-fix/payload.zip")
          destination = Path("/tmp/divar-final-fix/extracted")
          destination.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive_path) as archive:
              actual = {
                  item.filename
                  for item in archive.infolist()
                  if not item.is_dir()
              }

              if actual != expected:
                  raise SystemExit(
                      "Bundle file list mismatch. "
                      f"missing={sorted(expected - actual)} "
                      f"unexpected={sorted(actual - expected)}"
                  )

              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts or not path.parts:
                      raise SystemExit(f"Unsafe bundle path: {item.filename}")

                  mode = item.external_attr >> 16
                  if mode and stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink is not allowed: {item.filename}")

              archive.extractall(destination)

          for relative_path in expected:
              if not (destination / relative_path).is_file():
                  raise SystemExit(f"Extracted file is missing: {relative_path}")
          PY

      - name: Create isolated target branch and apply approved files
        shell: bash
        run: |
          set -euo pipefail
          git switch --create "${TARGET_BRANCH}"

          python - <<'PY'
          from pathlib import Path
          import shutil

          files = ['divar_service/config/settings.py', 'divar_service/config/aliases.py', 'divar_service/normalizer.py', 'divar_service/extractor.py', 'divar_service/models.py', 'divar_service/comparison.py', 'divar_service/deal_finder.py', 'divar_service/analyzer.py', 'divar_service/filters.py', 'divar_service/page_parser.py', 'divar_service/storage/database.py', 'divar_service/storage/ads_repository.py', 'divar_service/storage/schedule_repository.py', 'divar_service/scheduler.py', 'divar_service/collector.py', 'divar_service/app.py']
          source_root = Path("/tmp/divar-final-fix/extracted")
          repository_root = Path.cwd()

          for relative_path in files:
              source = source_root / relative_path
              destination = repository_root / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY

      - name: Verify change scope
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          expected = set(['divar_service/config/settings.py', 'divar_service/config/aliases.py', 'divar_service/normalizer.py', 'divar_service/extractor.py', 'divar_service/models.py', 'divar_service/comparison.py', 'divar_service/deal_finder.py', 'divar_service/analyzer.py', 'divar_service/filters.py', 'divar_service/page_parser.py', 'divar_service/storage/database.py', 'divar_service/storage/ads_repository.py', 'divar_service/storage/schedule_repository.py', 'divar_service/scheduler.py', 'divar_service/collector.py', 'divar_service/app.py'])
          modified = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--"],
                  text=True,
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          changed = modified | untracked
          unexpected = sorted(changed - expected)

          if unexpected:
              raise SystemExit("Unexpected files changed: " + ", ".join(unexpected))
          if not changed:
              raise SystemExit("No code changes were detected; nothing to commit.")

          print("Approved changed files:")
          for path in sorted(changed):
              print(f"- {path}")
          PY

      - name: Run complete offline preflight
        shell: bash
        env:
          DIVAR_INITIAL_REQUEST_DELAY_MIN: "0"
          DIVAR_INITIAL_REQUEST_DELAY_MAX: "0"
          DIVAR_DRY_RUN: "true"
        run: |
          set -euo pipefail

          python -m compileall -q divar_service
          python -c "from divar_service.app import main"

          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace

          from divar_service.collector import IncrementalCollector
          from divar_service.deal_finder import find_deals
          from divar_service.divar_client import DivarBlockedError
          from divar_service.extractor import extract_vehicle
          from divar_service.models import VehicleAd
          from divar_service.normalizer import normalize_for_match, normalize_year
          from divar_service.page_parser import extract_search_items
          from divar_service.scheduler import DailyScheduler
          from divar_service.storage.ads_repository import AdsRepository
          from divar_service.storage.database import Database
          from divar_service.storage.schedule_repository import ScheduleRepository

          assert normalize_year("97") == 1397
          assert normalize_year("402") == 1402
          assert normalize_year("1402") == 1402
          assert normalize_year("2013") == 2013
          assert normalize_for_match("405تیوفایو مدل۱۴۰۲ تیپ5") == "405 تیوفایو مدل 1402 تیپ 5"

          extraction_cases = (
              ("دنا پلاس توربو اتوماتیک مدل ۱۴۰۲", ("Iran Khodro", "Dena", "پلاس توربو اتوماتیک", 1402)),
              ("سورن پلاس مدل ۱۴۰۲", ("Iran Khodro", "Samand", "سورن پلاس", 1402)),
              ("۲۰۶ تیپ ۵ مدل ۹۶", ("Peugeot", "206", "تیپ 5", 1396)),
              ("ال 90 مدل 87 e2 تک برگ سند", ("Renault", "L90", "E2", 1387)),
              ("سوناتا yf ۲۰۱۴", ("Hyundai", "Sonata", "", 2014)),
              ("پارس سال مدل ۱۴۰۰", ("Peugeot", "Pars", "سال", 1400)),
              ("کوییک r مدل ۱۴۰۲", ("Saipa", "Quick", "R", 1402)),
          )

          for title, expected in extraction_cases:
              vehicle = extract_vehicle(title)
              assert vehicle is not None, title
              actual = (vehicle.brand, vehicle.model, vehicle.trim, vehicle.year)
              assert actual == expected, (title, actual, expected)

          assert extract_vehicle("کوئیک RS مدل ۱۴۰۲") is None

          search_html = """
          <html><body>
            <a href="/v/ال-90-مدل-87-e2/ga-testE2?tracker_session_id=x">
              <div>ال 90 مدل 87 E2 تک برگ سند</div>
              <div>695,000,000 تومان</div>
              <div>کارکرد 240,000 کیلومتر</div>
            </a>
          </body></html>
          """

          parsed_items = extract_search_items(search_html)
          assert len(parsed_items) == 1
          parsed = parsed_items[0]
          assert parsed.ad_id == "ga-testE2"
          assert parsed.price == 695_000_000
          assert parsed.year == 87
          assert parsed.mileage == 240_000
          assert "?" not in parsed.url

          def make_ad(ad_id: str, price: int, *, trim: str = "E2") -> VehicleAd:
              return VehicleAd(
                  ad_id=ad_id,
                  brand="Renault",
                  model="L90",
                  trim=trim,
                  year=1387,
                  price=price,
                  url=f"https://divar.ir/v/test/{ad_id}",
              )

          lower = find_deals(
              [make_ad("lower-1", 98), make_ad("lower-2", 100), make_ad("lower-3", 102)],
              min_sample_count=3,
              min_deal_percent=2,
              max_deal_percent=10,
          )
          assert len(lower) == 1 and lower[0].diff_percent == 2.0

          upper = find_deals(
              [make_ad("upper-1", 90), make_ad("upper-2", 100), make_ad("upper-3", 110)],
              min_sample_count=3,
              min_deal_percent=2,
              max_deal_percent=10,
          )
          assert len(upper) == 1 and upper[0].diff_percent == 10.0

          suspicious = find_deals(
              [make_ad("suspect-1", 89), make_ad("suspect-2", 100), make_ad("suspect-3", 111)],
              min_sample_count=3,
              min_deal_percent=2,
              max_deal_percent=10,
          )
          assert suspicious == []

          separate_trims = find_deals(
              [
                  make_ad("e1-1", 90, trim="E1"),
                  make_ad("e1-2", 100, trim="E1"),
                  make_ad("e2-1", 90, trim="E2"),
                  make_ad("e2-2", 100, trim="E2"),
              ],
              min_sample_count=3,
              min_deal_percent=0,
              max_deal_percent=100,
          )
          assert separate_trims == []

          collector_settings = SimpleNamespace(
              max_pages=1,
              max_ads_per_run=60,
              initial_request_delay_min=0,
              initial_request_delay_max=0,
          )

          class SearchOnlyClient:
              def __init__(self) -> None:
                  self.search_calls = 0

              def fetch_search_page(self, page_number: int) -> str:
                  self.search_calls += 1
                  assert page_number == 1
                  return search_html

              def sleep_after_page(self, page_number: int) -> float:
                  raise AssertionError("Pagination must not run for max_pages=1.")

          class BlockedClient:
              def __init__(self) -> None:
                  self.search_calls = 0

              def fetch_search_page(self, page_number: int) -> str:
                  self.search_calls += 1
                  raise DivarBlockedError("simulated 429")

              def sleep_after_page(self, page_number: int) -> float:
                  raise AssertionError("No request may follow a blocking response.")

          with TemporaryDirectory() as temporary_directory:
              database = Database(Path(temporary_directory) / "state.db")
              database.initialize()
              ads_repository = AdsRepository(database)

              assert ads_repository.upsert(make_ad("price-update", 100)) is True
              assert ads_repository.upsert(make_ad("price-update", 110)) is False
              stored = ads_repository.get("price-update")
              assert stored is not None and stored.price == 110

              search_client = SearchOnlyClient()
              collected = IncrementalCollector(
                  settings=collector_settings,
                  client=search_client,
                  ads_repository=ads_repository,
              ).collect()
              assert search_client.search_calls == 1
              assert collected.blocked is False
              assert collected.ads_saved == 1

              blocked_client = BlockedClient()
              blocked = IncrementalCollector(
                  settings=collector_settings,
                  client=blocked_client,
                  ads_repository=ads_repository,
              ).collect()
              assert blocked_client.search_calls == 1
              assert blocked.blocked is True
              assert blocked.stop_reason == "divar_blocked"
              assert blocked.pages_requested == 0

              schedule_repository = ScheduleRepository(database)
              schedule_settings = SimpleNamespace(
                  timezone="Asia/Tehran",
                  schedule_start="10:30",
                  schedule_end="00:30",
                  runs_per_day=4,
                  minimum_gap_minutes=90,
              )
              scheduler = DailyScheduler(
                  settings=schedule_settings,
                  repository=schedule_repository,
              )

              first_day = scheduler.ensure_daily_schedule(date(2026, 8, 14))
              second_day = scheduler.ensure_daily_schedule(date(2026, 8, 15))
              assert len(first_day) == 4 and len(second_day) == 4

              for runs in (first_day, second_day):
                  gaps = [
                      (later.scheduled_for - earlier.scheduled_for).total_seconds() / 60
                      for earlier, later in zip(runs, runs[1:])
                  ]
                  assert min(gaps) >= 90

              first_signature = tuple(run.scheduled_for.strftime("%H:%M") for run in first_day)
              second_signature = tuple(run.scheduled_for.strftime("%H:%M") for run in second_day)
              assert first_signature != second_signature

              closed = scheduler.close_remaining_runs(date(2026, 8, 15))
              assert closed == 4
              assert all(
                  run.executed
                  for run in schedule_repository.list_for_date(date(2026, 8, 15))
              )

          print("All offline Divar final-fix tests passed.")
          PY

      - name: Commit and push tested code branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > /tmp/divar-approved-files.txt <<'EOF'
          divar_service/config/settings.py
          divar_service/config/aliases.py
          divar_service/normalizer.py
          divar_service/extractor.py
          divar_service/models.py
          divar_service/comparison.py
          divar_service/deal_finder.py
          divar_service/analyzer.py
          divar_service/filters.py
          divar_service/page_parser.py
          divar_service/storage/database.py
          divar_service/storage/ads_repository.py
          divar_service/storage/schedule_repository.py
          divar_service/scheduler.py
          divar_service/collector.py
          divar_service/app.py
          EOF

          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            git add -- "${path}"
          done < /tmp/divar-approved-files.txt

          if git diff --cached --quiet; then
            echo "No staged changes are available to commit."
            exit 1
          fi

          git diff --cached --check
          git commit -m "Apply final Divar service stability fixes"
          git push --set-upstream origin "${TARGET_BRANCH}"

      - name: Write completion summary
        shell: bash
        run: |
          {
            echo "## Divar final fix applied successfully"
            echo
            echo "A tested branch was created and pushed:"
            echo
            echo "\`${TARGET_BRANCH}\`"
            echo
            echo "No request was sent to Divar or Telegram by this installer."
            echo "The existing Divar service workflow was intentionally left unchanged."
            echo "Review and merge the branch in GitHub, then run only dry_run first."
          } >> "${GITHUB_STEP_SUMMARY}"
