name: Apply Divar Final Fix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "برای تأیید دقیقاً APPLY_DIVAR_FINAL_FIX را وارد کنید"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apply-divar-final-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Validate and create divar-final-fix branch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TARGET_BRANCH: "divar-final-fix"
      EXPECTED_BUNDLE_SHA256: "780f1609cd7c4d51f76440d93b17e6e2f052d2637b981f9b206d38a2a44bfc1f"

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate confirmation and branch safety
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirmation }}" != "APPLY_DIVAR_FINAL_FIX" ]]; then
            echo "Confirmation text is incorrect. No files were changed."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "divar-state" ]]; then
            echo "This workflow must not run from divar-state."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == "${TARGET_BRANCH}" ]]; then
            echo "Run this workflow from the current project branch, not ${TARGET_BRANCH}."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Remote branch ${TARGET_BRANCH} already exists. Nothing was overwritten."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Checkout is not clean."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-divar.txt

      - name: Install Divar dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-divar.txt

      - name: Decode and verify embedded code bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/divar-final-fix
          mkdir -p /tmp/divar-final-fix

          cat > /tmp/divar-final-fix/payload.zip.b64 <<'DIVAR_FINAL_FIX_BUNDLE'
